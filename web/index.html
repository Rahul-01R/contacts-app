<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Contacts App</h1>

        <div class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Search contacts..."
            >

            <button id="addContact">
                + Add Contact
            </button>

        </div>

        <!-- JavaScript will generate all contact cards here -->
        <section id="contacts-container" class="contacts-grid"></section>

    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>

</body>

</html>
