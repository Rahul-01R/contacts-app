<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <div class="header-content">

                <h1>Contacts App</h1>

                <p>Manage your contacts easily</p>

            </div>

        </header>


        <!-- Search and Add -->
        <section class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Search contacts by name or phone..."
                autocomplete="off"
            >

            <button id="addContact" class="primary-btn">
                + Add Contact
            </button>

        </section>


        <!-- Messages -->
        <div
            id="app-message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- Contacts -->
        <section class="contacts-section">

            <div class="section-heading">

                <h2>My Contacts</h2>

            </div>


            <div id="contacts-container">

                <p class="loading">
                    Loading contacts...
                </p>

            </div>

        </section>


        <!-- Add/Edit Dialog -->
        <dialog id="contactDialog">

            <div class="dialog-content">

                <div class="dialog-header">

                    <h2 id="dialogTitle">
                        Add Contact
                    </h2>

                    <button
                        type="button"
                        id="closeDialog"
                        class="close-btn"
                        aria-label="Close dialog"
                    >
                        &times;
                    </button>

                </div>


                <!-- Contact Form -->
                <form id="contactForm">

                    <input
                        type="hidden"
                        id="contactId"
                    >


                    <label for="name">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                        required
                    >


                    <label for="phone">
                        Phone Number *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >


                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >


                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter address"
                        rows="3"
                    ></textarea>


                    <div class="form-buttons">

                        <button
                            type="submit"
                            id="saveContact"
                            class="primary-btn"
                        >
                            Save Contact
                        </button>


                        <button
                            type="button"
                            id="cancelContact"
                            class="secondary-btn"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </dialog>

    </div>


    <!-- JavaScript -->

    <script src="api.js"></script>

    <script src="app.js"></script>

</body>

</html>
