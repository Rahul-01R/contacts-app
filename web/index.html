```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header class="header">

            <h1>Contacts App</h1>

            <p>Manage your contacts easily</p>

        </header>


        <!-- Search and Add Contact Section -->
        <section class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Search contacts..."
                autocomplete="off"
            >

            <button id="addContact">
                + Add Contact
            </button>

        </section>


        <!-- Success and Error Messages -->
        <p id="app-message" role="status" aria-live="polite"></p>


        <!-- Contacts Section -->
        <section class="contacts-section">

            <h2>My Contacts</h2>

            <div id="contacts-container">

                <p>Loading contacts...</p>

            </div>

        </section>


        <!-- Add / Edit Contact Dialog -->
        <dialog id="contactDialog">

            <div class="dialog-content">

                <h2 id="dialogTitle">Add Contact</h2>


                <!-- Contact Form -->
                <form id="contactForm">

                    <!-- Hidden Contact ID -->
                    <input
                        type="hidden"
                        id="contactId"
                    >


                    <!-- Name -->
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                        required
                    >


                    <!-- Phone -->
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >


                    <!-- Email -->
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >


                    <!-- Address -->
                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter address"
                        rows="3"
                    ></textarea>


                    <!-- Form Buttons -->
                    <div class="form-buttons">

                        <button
                            type="submit"
                            id="saveContact"
                        >
                            Save Contact
                        </button>


                        <button
                            type="button"
                            id="cancelContact"
                        >
                            Cancel
                        </button>

                    </div>

                </form>


                <!-- Close Dialog Button -->
                <button
                    type="button"
                    id="closeDialog"
                    aria-label="Close dialog"
                >
                    Close
                </button>

            </div>

        </dialog>

    </div>


    <!-- JavaScript Files -->

    <!-- API communication -->
    <script src="api.js"></script>

    <!-- Application logic -->
    <script src="app.js"></script>

</body>

</html>
```
